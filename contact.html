  <main>
    <section id="contact" class="content-box">
      <h2>Contact Me</h2>
      <p>Feel free to reach out for collaborations, web projects, or academic inquiries.</p>
      <p><strong>Email Address:</strong> <a href="mailto:ragen.william@students.kcau.ac.ke" class="email-link">ragen.william@students.kcau.ac.ke</a></p>

      <form action="#" method="POST" class="contact-form">
        <div class="form-group">
          <label for="fullname">Full Name:</label>
          <input type="text" id="fullname" name="fullname" placeholder="Enter your name" required>
        </div>

        <div class="form-group">
          <label for="email">Email Address:</label>
          <input type="email" id="email" name="email" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
          <label for="subject">Subject:</label>
          <input type="text" id="subject" name="subject" placeholder="Project inquiry or message">
        </div>

        <div class="form-group">
          <label for="message">Message:</label>
          <textarea id="message" name="message" rows="5" placeholder="Write your message here..." required></textarea>
        </div>

        <button type="submit" class="btn">Send Message</button>
      </form>
    </section>
  </main>
